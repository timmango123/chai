<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>找不到這個頁面 - 少年仔、安啦會客室</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #FDFBF7; color: #3A2E2A; font-family: system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    main { width: 100%; max-width: 440px; padding: 2rem 1.5rem; text-align: center; background: #fff;
      border: 1px solid #E8DCCF; border-radius: 20px; box-shadow: 0 6px 18px rgba(0, 0, 0, .06); }
    .sprout { font-size: 2.5rem; }
    h1 { margin: .4rem 0 .6rem; font-size: 1.35rem; color: #A94A2A; }
    p { margin: .4rem 0; line-height: 1.7; color: #6B5A50; }
    .actions { display: grid; gap: .6rem; margin: 1.25rem 0 1rem; }
    a.button { display: block; min-height: 48px; line-height: 48px; border-radius: 12px; text-decoration: none; font-weight: 700; }
    a.primary { background: #A94A2A; color: #fff; }
    a.secondary { border: 1px solid #E8DCCF; color: #3A2E2A; background: #FDFBF7; }
    .phones { font-size: .9rem; }
    .phones a { color: #991B1B; font-weight: 700; }
    a:focus-visible { outline: 3px solid #A94A2A; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="sprout" aria-hidden="true">🌱</div>
    <h1>找不到這個頁面</h1>
    <p>網址可能打錯了，或這個頁面已經搬家。沒關係，從下面回去就好。</p>
    <div class="actions">
      <a class="button primary" href="/">回到安啦會客室</a>
      <a class="button secondary" href="/resources">看南投求助資源</a>
    </div>
    <p class="phones">需要立即協助：<a href="tel:1925">1925 安心專線</a>／<a href="tel:119">119 緊急救護</a></p>
  </main>
</body>
</html>
